global:
  scrape_interval: 15s

scrape_configs:
  # Monitor Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # Monitor VoltBuddy Node.js backend
  - job_name: "voltbuddy-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5001"]