name: VoltBuddy Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "voltbuddy-backend/**"
      - ".github/workflows/backend-cicd.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voltbuddy-backend-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: voltbuddy-backend
  ECS_CLUSTER: voltbuddy-backend-cluster
  ECS_SERVICE: voltbuddy-backend-service
  ECS_TASK_DEFINITION_FAMILY: voltbuddy-backend-task
  CONTAINER_NAME: voltbuddy-backend

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./voltbuddy-backend

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION_FAMILY" \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Render new task definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify backend health
        run: |
          for i in {1..12}; do
            if curl --fail --silent \
              http://voltbuddy-backend-alb-872090665.us-east-1.elb.amazonaws.com/health; then
              echo
              echo "Backend health check passed."
              exit 0
            fi

            echo "Health check attempt $i failed; retrying..."
            sleep 10
          done

          echo "Backend health check failed."
          exit 1